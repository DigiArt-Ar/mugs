<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DigiArt AR - Experiência Digital</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      :root { --azul-profundo: #003366; --ceruleo: #3A78B8; --branco: #ffffff; }
      body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
      
      .interface-validacao {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; z-index: 9999; text-align: center;
        padding: 25px; box-sizing: border-box; background: var(--branco); color: var(--azul-profundo);
      }

      .logo-container { margin-bottom: 30px; width: 100%; max-width: 300px; }
      .logo-img { width: 100%; height: auto; }

      h2 { font-size: 22px; margin-bottom: 10px; color: var(--azul-profundo); }
      .texto-explicativo { font-size: 15px; line-height: 1.5; margin-bottom: 25px; color: #555; max-width: 320px; }
      
      .input-token {
        width: 100%; max-width: 280px; padding: 15px; border: 2px solid #e1e8ed;
        border-radius: 12px; font-size: 18px; text-align: center; margin-bottom: 20px;
        text-transform: lowercase; background: #f9fbff;
      }

      .btn-ativar {
        width: 100%; max-width: 280px; padding: 18px; border-radius: 12px;
        border: none; background: var(--ceruleo); color: var(--branco);
        font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase;
      }

      #tela-expirado { background: var(--azul-profundo); color: white; display: none; }
      .btn-renovar { background: #28a745; text-decoration: none; padding: 15px 30px; border-radius: 10px; color: white; font-weight: bold; margin-top: 20px; }

      .footer-frase { position: absolute; bottom: 20px; font-size: 12px; opacity: 0.6; }
      .a-enter-vr { display: none !important; }
    </style>
  </head>
  <body>

    <div id="tela-token" class="interface-validacao">
      <div class="logo-container">
        <img src="logo-digiart-ar.jpeg" alt="DigiArt AR" class="logo-img">
      </div>
      <h2>Prepare-se para uma Nova Dimensão!</h2>
      <p class="texto-explicativo">
        Seu produto possui um <b>Token Exclusivo</b>: um código único e seguro que libera a sua Experiência Digital.
      </p>
      <input type="text" id="token-input" class="input-token" placeholder="ex: s4592k" maxlength="6">
      <button class="btn-ativar" onclick="validarAcesso()">Ver Minha Mensagem Exclusiva</button>
      <div class="footer-frase">Onde o papel ganha vida com arte.</div>
    </div>

    <div id="tela-expirado" class="interface-validacao">
      <h2>Jornada Finalizada</h2>
      <p>Seu ciclo de 365 dias chegou ao fim. Que tal renovar sua dose de fé e carinho?</p>
      <a href="https://wa.me/5524981035118" class="btn-renovar">RENOVAR AGORA</a>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" vr-mode-ui="enabled: false">
      <a-assets id="assets-folder"></a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video id="video-screen" position="0 0 0" width="1" height="1.77" scale="1.5 1.5 1.5"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const TOTAL_VIDEOS = 26; 
      const VALIDADE_DIAS = 365;

      function validarAcesso() {
        const tokenInserido = document.getElementById('token-input').value.trim().toLowerCase();
        
        if(tokenInserido.length < 5) {
          alert("Por favor, insira um token válido.");
          return;
        }

        // Lógica de Data (LocalStorage por enquanto, Firebase na segunda)
        let dataInicio = localStorage.getItem('digiart_inicio_' + tokenInserido);
        const hoje = new Date();

        if (!dataInicio) {
          dataInicio = hoje.getTime();
          localStorage.setItem('digiart_inicio_' + tokenInserido, dataInicio);
        }

        const diasPassados = Math.ceil((hoje.getTime() - dataInicio) / (24 * 60 * 60 * 1000)) || 1;

        if (diasPassados > VALIDADE_DIAS) {
          document.getElementById('tela-token').style.display = 'none';
          document.getElementById('tela-expirado').style.display = 'flex';
          return;
        }

        // Seleção do vídeo do dia (Projeto Salmos/Orixás)
        let videoId = diasPassados % TOTAL_VIDEOS;
        if (videoId === 0) videoId = TOTAL_VIDEOS;

        iniciarAR(videoId + ".mp4");
      }

      function iniciarAR(videoSrc) {
        document.getElementById('tela-token').style.display = 'none';
        const sceneEl = document.querySelector('a-scene');
        sceneEl.systems["mindar-image-system"].start();
        
        const assets = document.querySelector('#assets-folder');
        const v = document.createElement('video');
        v.id = 'vid'; 
        v.src = videoSrc; 
        v.loop = true; 
        v.setAttribute('crossorigin', 'anonymous');
        v.setAttribute('playsinline', 'true');
        v.setAttribute('webkit-playsinline', 'true');
        
        assets.appendChild(v);
        document.querySelector('#video-screen').setAttribute('src', '#vid');
        
        sceneEl.addEventListener('targetFound', () => v.play());
        sceneEl.addEventListener('targetLost', () => v.pause());
      }
    </script>
  </body>
</html>
