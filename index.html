<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiArt AR - Validação de Token</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0d47a1 0%, #002171 100%); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center; 
        }
        .container { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 30px; 
            border-radius: 15px; 
            backdrop-filter: blur(10px); 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); 
            width: 85%; 
            max-width: 400px; 
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #ffca28; }
        p { font-size: 16px; margin-bottom: 20px; opacity: 0.9; }
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 15px 0; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            text-align: center; 
            box-sizing: border-box;
            text-transform: uppercase; /* Facilita para o cliente digitar */
        }
        button { 
            background-color: #ffca28; 
            color: #002171; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            font-size: 18px; 
            transition: 0.3s; 
        }
        button:hover { background-color: #ffd54f; transform: scale(1.02); }
        #mensagem { 
            margin-top: 25px; 
            font-weight: bold; 
            min-height: 24px; 
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ DigiArt AR ✨</h1>
        <p>Insira seu Token para liberar sua mensagem exclusiva dos 365 Salmos.</p>
        
        <input type="text" id="tokenInput" placeholder="EX: S40026" maxlength="15">
        <button onclick="validarToken()">LIBERAR AGORA</button>

        <p id="mensagem"></p>
    </div>

    <script>
        // CONFIGURAÇÃO DO SEU FIREBASE (ATUALIZADO)
        const firebaseConfig = {
            apiKey: "AIzaSyDG-0ErUD35BZTHb9RZ21fFnXcMkX-IlZY",
            authDomain: "digiart-ar-sistema.firebaseapp.com",
            databaseURL: "https://digiart-ar-sistema-default-rtdb.firebaseio.com",
            projectId: "digiart-ar-sistema",
            storageBucket: "digiart-ar-sistema.firebasestorage.app",
            messagingSenderId: "497522538079",
            appId: "1:497522538079:web:6ee88681098324dc28cdea"
        };

        // Inicializa Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function validarToken() {
            const tokenInput = document.getElementById('tokenInput').value.trim().toUpperCase();
            const msg = document.getElementById('mensagem');

            if (!tokenInput) {
                msg.innerHTML = "❌ Por favor, digite seu token.";
                msg.style.color = "#ff8a80";
                return;
            }

            msg.innerHTML = "⏳ Verificando no sistema...";
            msg.style.color = "#fff";

            // Referência direta ao token no banco de dados
            const tokenRef = database.ref('/' + tokenInput);

            tokenRef.once('value').then((snapshot) => {
                const dadosToken = snapshot.val();

                if (snapshot.exists()) {
                    // Verifica se o valor guardado no banco é a palavra "usado"
                    if (dadosToken === "usado") {
                        msg.innerHTML = "❌ Este token já foi utilizado.<br>Cada código é válido para apenas um acesso.";
                        msg.style.color = "#ffb74d";
                    } else {
                        // TOKEN VÁLIDO! Marca como "usado" antes de redirecionar
                        tokenRef.set("usado").then(() => {
                            msg.innerHTML = "✅ Token Validado!<br>Preparando sua experiência...";
                            msg.style.color = "#81c784";
                            
                            setTimeout(() => {
                                // AQUI VOCÊ DEVE COLOCAR O LINK FINAL DO VÍDEO OU AR
                                window.location.href = "SEU_LINK_DO_VIDEO_OU_PAGINA_AR_AQUI"; 
                            }, 2000);
                        });
                    }
                } else {
                    // O Token digitado não existe na lista do Firebase
                    msg.innerHTML = "❌ Token não encontrado.<br>Verifique se digitou corretamente.";
                    msg.style.color = "#ff8a80";
                }
            }).catch((error) => {
                console.error("Erro no Firebase:", error);
                msg.innerHTML = "⚠️ Erro de conexão.<br>Tente novamente em instantes.";
            });
        }
    </script>
</body>
</html>
