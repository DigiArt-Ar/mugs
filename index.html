<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiArt AR - Validação</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0d47a1 0%, #002171 100%); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .container { background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); width: 85%; max-width: 400px; }
        h1 { font-size: 24px; color: #ffca28; margin-bottom: 10px; }
        input { width: 100%; padding: 15px; margin: 15px 0; border: none; border-radius: 8px; font-size: 18px; text-align: center; box-sizing: border-box; }
        button { background-color: #ffca28; color: #002171; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; }
        #mensagem { margin-top: 20px; font-weight: bold; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ DigiArt AR ✨</h1>
        <p>Digite seu código (letras minúsculas)</p>
        <input type="text" id="tokenInput" placeholder="ex: s77994" maxlength="15">
        <button onclick="validarToken()">LIBERAR ACESSO</button>
        <p id="mensagem"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDG-0ErUD35BZTHb9RZ21fFnXcMkX-IlZY",
            authDomain: "digiart-ar-sistema.firebaseapp.com",
            databaseURL: "https://digiart-ar-sistema-default-rtdb.firebaseio.com",
            projectId: "digiart-ar-sistema",
            storageBucket: "digiart-ar-sistema.firebasestorage.app",
            messagingSenderId: "497522538079",
            appId: "1:497522538079:web:6ee88681098324dc28cdea"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function validarToken() {
            const tokenDigitado = document.getElementById('tokenInput').value.trim().toLowerCase();
            const msg = document.getElementById('mensagem');

            if (!tokenDigitado) {
                msg.innerHTML = "❌ Digite um token.";
                return;
            }

            msg.innerHTML = "⏳ Verificando...";
            msg.style.color = "#fff";

            // Nova lógica: Lê o banco todo para achar o token dentro da lista
            database.ref('/').once('value').then((snapshot) => {
                let encontrado = false;
                let chaveEncontrada = null;
                let statusAtual = "";

                snapshot.forEach((childSnapshot) => {
                    const dados = childSnapshot.val();
                    // Verifica se o token digitado é igual ao token daquela linha do Excel
                    if (dados.token === tokenDigitado || dados.TOKEN === tokenDigitado) {
                        encontrado = true;
                        chaveEncontrada = childSnapshot.key;
                        statusAtual = dados.status || dados.STATUS;
                    }
                });

                if (encontrado) {
                    if (statusAtual === "usado") {
                        msg.innerHTML = "❌ Este token já foi utilizado.";
                        msg.style.color = "#ffb74d";
                    } else {
                        // Marca como usado dentro da subpasta correta
                        database.ref('/' + chaveEncontrada).update({ status: "usado", STATUS: "usado" }).then(() => {
                            msg.innerHTML = "✅ Token Validado!<br>Abrindo sua experiência...";
                            msg.style.color = "#81c784";
                            setTimeout(() => {
                                window.location.href = "SEU_LINK_AQUI"; 
                            }, 2000);
                        });
                    }
                } else {
                    msg.innerHTML = "❌ Token não encontrado.<br>Verifique se digitou corretamente.";
                    msg.style.color = "#ff8a80";
                }
            }).catch((error) => {
                console.error(error);
                msg.innerHTML = "⚠️ Erro de conexão.";
            });
        }
    </script>
</body>
</html>
