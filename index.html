<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://mind-ar.com/assets/js/mindar-image-aframe.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #example-scanning-overlay {
        display: flex; align-items: center; justify-content: center;
        position: absolute; left: 0; right: 0; top: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.5); z-index: 2;
      }
      @media (min-aspect-ratio: 1/1) { #example-scanning-overlay { flex-direction: row; } }
      @media (max-aspect-ratio: 1/1) { #example-scanning-overlay { flex-direction: column; } }
    </style>
  </head>
  <body>
    <div id="example-scanning-overlay" class="hidden">
      <div class="inner">
        <img src="assets/img/scanning.png" style="width: 200px; height: auto;"/>
        <div class="scanline"></div>
      </div>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./assets/targets/targets.mind; showStats: false; uiScanning: #example-scanning-overlay;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="video-mp4" src="./assets/video/video.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video id="video-obj" src="#video-mp4" width="1" height="1.77" position="0 0 0" scale="1.1 1.1 1.1" class="clickable"></a-video>
      </a-entity>
    </a-scene>

    <script>
      // SCRIPT PARA DAR PLAY AO TOCAR NA TELA OU AO RECONHECER O TARGET
      const video = document.querySelector("#video-mp4");
      const sceneEl = document.querySelector("a-scene");

      sceneEl.addEventListener("targetFound", event => {
        video.play();
      });

      sceneEl.addEventListener("targetLost", event => {
        video.pause();
      });

      // GARANTE O PLAY SE O USUÁRIO TOCAR NA TELA
      window.addEventListener('click', () => {
        if (video.paused) {
          video.play();
        }
      });
    </script>
  </body>
</html>
